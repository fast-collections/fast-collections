name: branch validation
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest maturin
      - run: python -m pip install .
      - run: cd / && python -m pytest "$GITHUB_WORKSPACE/tests/" -v
